plugins {
    // Import Strider Saddle
    // Strider Saddle greatly simplifies the project by automatically managing
    // StriderLoader and Minecraft dependencies, versioning, resources, and more.
    id "dev.nozyx.strider.saddle" version "1.0.0"

    // ( Strider Saddle automatically applies the 'java' plugin.
    // You can still add 'java-library' after this if you want to make your addon a library. )
}

saddle {
    // The StriderLoader version your addon will use.
    // ( Using the latest version is recommended for the latest features and Minecraft support. )
    loaderVersion = "1.2.0"

    // The Minecraft version your addon targets.
    // ( Make sure this version is supported by the selected StriderLoader version. )
    minecraftVersion = "26.2"

    // The Minecraft side your addon targets.
    // ( Possible values: "client", "server", "common" )
    minecraftSide = "common"

    // The major Java version your addon will be compiled with.
    // ( Use a Java version compatible with your target Minecraft version.
    // Must be at least the Java version supported by StriderLoader; currently Java 25. )
    javaVersion = 25
}

group = "com.example"
version = "1.0.0"

repositories {
    // ( Strider Saddle automatically adds Maven Central and the repository hosting StriderLoader. )

    // Add your addon-specific repositories here.
}

dependencies {
    // ( Strider Saddle automatically adds the selected StriderLoader version as compileOnly. )

    // Add your addon dependencies here.
}
