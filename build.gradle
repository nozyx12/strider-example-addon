plugins {
    id "java"

    // Optional: Importing Fabric Loom to be able to easily access Minecraft's classes in your Addon.
    id "net.fabricmc.fabric-loom" version "1.17-SNAPSHOT"
}

ext {
    // What StriderLoader version will your addon use.
    // ( I recommend using the latest version for the latest features and Minecraft version support )
    loader_version = "1.1.0"

    // What Minecraft version your addon is compatible with.
    // ( Make sure this version is supported by the selected StriderLoader version )
    minecraft_version = "26.2"

    // What major Java version your addon will be compiled with.
    // ( Use a Java version compatible with your targeted Minecraft version )
    java_version = 25
}

def loader_major_version = loader_version.tokenize(".")[0].toInteger()
def next_major_version = loader_major_version + 1

def loader_version_range = ">=${loader_version} <${next_major_version}.0.0"

group = "com.example"
version = "1.0.0"

repositories {
    // Maven Central repository.
    mavenCentral()

    // Repository hosting StriderLoader.
    maven {
        name "nozyx"
        url "https://maven.nozyx.dev/"
    }

    // Put your addon repositories here.
}

dependencies {
    implementation "dev.nozyx.strider:striderloader:${loader_version}"

    // Optional: Importing Minecraft's classes to be able to easily access Minecraft's classes in your Addon.
    // ( Thanks to Fabric Loom )
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // Put your addon dependencies here.
}

tasks.withType(AbstractArchiveTask).configureEach {
    archiveFileName = "${rootProject.name}-${version}+mc${minecraft_version}.${archiveExtension.get()}"
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(java_version))
    }
}

processResources {
    filesMatching("strideraddon.json") {
        expand(
                id: rootProject.name,
                version: version,
                loader_version_range: loader_version_range,
                mc_version: minecraft_version,
                java_version: java_version
        )
    }
}
